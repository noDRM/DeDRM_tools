name: Package plugin
on:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Package
        run: python3 make_release.py

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: plugin
          path: |
            DeDRM_tools_*.zip
            DeDRM_tools.zip

      - name: Prepare release
        run: cp DeDRM_tools.zip DeDRM_alpha_${{ github.sha }}.zip

      - name: Delete older prerelease releases
        env:
          GH_TOKEN: ${{ secrets.AUTORELEASE_KEY }}
        run: |
          set -euo pipefail
          repo="sebasriva94-cpu/DeDRM_tools_autorelease"
          keep_latest=5
          tags=$(gh release list --repo "$repo" --limit 100 --json tagName,isPrerelease,publishedAt --jq '.[] | select(.isPrerelease) | .tagName' | sort -t_ -k2 -r || true)
          count=$(echo "$tags" | grep -c '^autorelease_' || true)
          if [ "$count" -le "$keep_latest" ]; then
            echo "Found $count prerelease(s), keeping all (threshold: $keep_latest)"
            exit 0
          fi
          echo "$tags" | tail -n +$((keep_latest + 1)) | while read -r tag; do
            echo "Deleting release $tag from $repo"
            gh release delete "$tag" --repo "$repo" --yes || true
            gh api --method DELETE "repos/$repo/git/refs/tags/$tag" || true
          done

      - name: Auto-release
        id: autorelease
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844  # v1
        with:
          tag_name: autorelease_${{ github.sha }}
          repository: sebasriva94-cpu/DeDRM_tools_autorelease
          token: ${{ secrets.AUTORELEASE_KEY }}
          name: Automatic alpha release with latest changes
          body: |
            This release is automatically generated by Github for each commit.

            This means, every time a change is made to the repo, a release with an untested copy of the plugin at that stage will be created. This will contain the most up-to-date code, but it's not tested at all and may be broken.

            Last update based on Git commit [${{ github.sha }}](https://github.com/sebasriva94-cpu/DeDRM_tools/commit/${{ github.sha }}).
          prerelease: true
          draft: false
          files: DeDRM_alpha_${{ github.sha }}.zip
